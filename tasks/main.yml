---
# tasks file for lighthouse-role
- name: Install dependencies
  become: true
  ansible.builtin.apt:
    name:
      - git
      - nginx
    state: present
    update_cache: yes

- name: Create lighthouse directory
  become: true
  ansible.builtin.file:
    path: /var/www/lighthouse
    state: directory
    mode: '0755'

- name: Clone lighthouse repository
  become: true
  ansible.builtin.git:
    repo: https://github.com/VKCOM/lighthouse.git
    dest: /var/www/lighthouse
    version: master

- name: Configure nginx for lighthouse
  become: true
  ansible.builtin.template:
    src: lighthouse.conf.j2
    dest: /etc/nginx/sites-available/lighthouse.conf
    mode: '0644'
  notify: restart nginx

- name: Enable nginx site
  become: true
  ansible.builtin.file:
    src: /etc/nginx/sites-available/lighthouse.conf
    dest: /etc/nginx/sites-enabled/lighthouse.conf
    state: link
  notify: restart nginx

- name: Remove default nginx site
  become: true
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: restart nginx

- name: Ensure nginx is running
  become: true
  ansible.builtin.systemd:
    name: nginx
    state: started
    enabled: yes
